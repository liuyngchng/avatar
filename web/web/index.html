<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Web</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #canvas { display: block; position: fixed; top: 0; left: 0; opacity: 0; transition: opacity 1s ease-out; }
    #canvas.visible { opacity: 1; }
    #canvas.fading { opacity: 0; }

    /* Status overlay */
    .status {
      position: fixed; bottom: 40px; left: 0; right: 0;
      text-align: center; color: rgba(255,255,255,0.7);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 16px; pointer-events: none;
      transition: opacity 0.3s;
    }
    .status.hidden { opacity: 0; }

    /* Subtitle overlay — TTS spoken text. Stroked + shadowed so the
       text remains readable on top of any background. */
    .subtitle {
      position: fixed; bottom: 96px; left: 0; right: 0;
      text-align: center;
      color: #ffffff;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.6;
      pointer-events: none;
      padding: 0 24px;
      max-width: 100%;
      text-shadow:
        -1px -1px 0 rgba(0,0,0,0.85),
         1px -1px 0 rgba(0,0,0,0.85),
        -1px  1px 0 rgba(0,0,0,0.85),
         1px  1px 0 rgba(0,0,0,0.85),
         0 2px 6px rgba(0,0,0,0.6);
      transition: opacity 0.3s;
      word-break: break-word;
    }
    .subtitle.hidden { opacity: 0; }

    /* User-text overlay — ASR transcription of what the user said. */
    .user-text {
      position: fixed; bottom: 140px; left: 0; right: 0;
      text-align: center;
      color: #ffd97a;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.5;
      pointer-events: none;
      padding: 0 24px;
      max-width: 100%;
      text-shadow:
        -1px -1px 0 rgba(0,0,0,0.85),
         1px -1px 0 rgba(0,0,0,0.85),
        -1px  1px 0 rgba(0,0,0,0.85),
         1px  1px 0 rgba(0,0,0,0.85),
         0 2px 6px rgba(0,0,0,0.6);
      transition: opacity 0.3s;
      word-break: break-word;
    }
    .user-text.hidden { opacity: 0; }

    /* Loading overlay — shows during VRM model load + first frame. */
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: transparent; z-index: 999;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
    }
    .loading-overlay.hidden {
      opacity: 0; pointer-events: none;
    }
    .loading-spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(0,0,0,0.12);
      border-top-color: rgba(0,0,0,0.5);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      color: rgba(0,0,0,0.7);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 15px;
      font-weight: 500;
      text-shadow: 0 0 4px rgba(255,255,255,0.8);
      margin-bottom: 12px;
    }

    /* Progress bar — shown during VRM model download */
    .progress-bar-wrap {
      width: 200px; height: 4px;
      background: rgba(0,0,0,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; width: 0%;
      background: rgba(0,0,0,0.4);
      border-radius: 2px;
      transition: width 0.2s ease-out;
    }
    .progress-text {
      margin-top: 6px;
      color: rgba(0,0,0,0.45);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 12px;
    }

    /* Connection indicator */
    .connection {
      position: fixed; top: 12px; right: 16px;
      display: flex; align-items: center; gap: 8px;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px; color: rgba(0,0,0,0.55);
      pointer-events: none;
      text-shadow: 0 0 4px rgba(255,255,255,0.8);
    }
    .connection .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #e33;
      box-shadow: 0 0 0 3px rgba(227, 51, 51, 0.25);
    }
    .connection.connecting .dot {
      background: #fc0;
      box-shadow: 0 0 0 3px rgba(252, 204, 0, 0.25);
      animation: blink 0.8s ease-in-out infinite;
    }
    .connection.connected .dot {
      background: #3c3;
      box-shadow: 0 0 0 3px rgba(51, 204, 51, 0.25);
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* Fullscreen button */
    .fullscreen-btn {
      position: fixed; top: 12px; left: 16px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6); cursor: pointer;
      font-size: 16px; padding: 4px 10px; border-radius: 6px;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      transition: all 0.2s;
      z-index: 10;
    }
    .fullscreen-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }

    /* Mic permission prompt */
    .mic-prompt {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85); color: #fff;
      padding: 32px 40px; border-radius: 16px;
      text-align: center; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      z-index: 100;
    }
    .mic-prompt button {
      margin-top: 16px; padding: 10px 32px;
      border: none; border-radius: 8px; background: #4a6fa5; color: #fff;
      font-size: 16px; cursor: pointer; transition: background 0.2s;
    }
    .mic-prompt button:hover { background: #5a7fb5; }
    .mic-prompt.hidden { display: none; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">加载中...</div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>
  <canvas id="canvas"></canvas>
  <button class="fullscreen-btn" id="fullscreenBtn" title="全屏">⛶</button>
  <div class="connection" id="connection"><span class="dot"></span></div>
  <div class="status" id="status"></div>
  <div class="user-text hidden" id="userText"></div>
  <div class="subtitle hidden" id="subtitle"></div>
  <div class="mic-prompt hidden" id="micPrompt">
    <p>🎤 需要麦克风权限才能与数字人对话</p>
    <button id="micAllowBtn">允许麦克风</button>
  </div>

  <!-- All JS loaded locally (no CDN, for air-gapped deployment) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./js/three.module.js",
      "three/addons/": "./js/addons/",
      "@pixiv/three-vrm": "./js/three-vrm.module.js"
    }
  }
  </script>

  <script type="module" src="./js/app.min.js"></script>
</body>
</html>
