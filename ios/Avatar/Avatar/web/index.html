<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Avatar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1A1A2E;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    /* The canvas handles touch events — don't let the browser intercept */
    #canvas {
      display: block; position: fixed; left: 0; top: 0; z-index: 1;
      opacity: 0; transition: opacity 1s ease-out;
      touch-action: none;
    }
    #canvas.visible { opacity: 1; }
    #canvas.fading { opacity: 0; }

    /* Status text is shown by the native Swift overlay (RobotMainScreen) —
       no duplicate status element in the WebView. */

    /* Robot speaking subtitle */
    .subtitle {
      position: fixed; bottom: 96px; left: 0; right: 0;
      z-index: 2;
      text-align: center;
      color: #ffffff;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.6;
      pointer-events: none;
      padding: 0 24px;
      text-shadow:
        -1px -1px 0 rgba(0,0,0,0.85),
         1px -1px 0 rgba(0,0,0,0.85),
        -1px  1px 0 rgba(0,0,0,0.85),
         1px  1px 0 rgba(0,0,0,0.85),
         0 2px 6px rgba(0,0,0,0.6);
      transition: opacity 0.3s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subtitle.hidden { opacity: 0; }

    /* User utterance subtitle (ASR echo, shown while thinking) */
    .user-subtitle {
      position: fixed; bottom: 140px; left: 0; right: 0;
      z-index: 2;
      text-align: center;
      color: rgba(255,255,255,0.78);
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      pointer-events: none;
      padding: 0 24px;
      text-shadow:
        -1px -1px 0 rgba(0,0,0,0.85),
         1px -1px 0 rgba(0,0,0,0.85),
        -1px  1px 0 rgba(0,0,0,0.85),
         1px  1px 0 rgba(0,0,0,0.85),
         0 2px 6px rgba(0,0,0,0.6);
      transition: opacity 0.3s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-subtitle.hidden { opacity: 0; }

    /* Loading overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1A1A2E; z-index: 999;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
    }
    .loading-overlay.hidden {
      opacity: 0; pointer-events: none;
    }
    .loading-spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.7);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      color: rgba(255,255,255,0.65);
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">加载中...</div>
  </div>
  <canvas id="canvas"></canvas>
  <div class="subtitle hidden" id="subtitle"></div>
  <div class="user-subtitle hidden" id="userSubtitle"></div>

  <!-- Bridge buffer + console forwarding: defined synchronously -->
  <script>
  window._pendingMessages = [];
  window.handleMessage = function(jsonStr) {
    window._pendingMessages.push(jsonStr);
  };

  // Forward console logs to Swift so we can see WebView errors in Xcode.
  (function() {
    const _log = console.log.bind(console);
    const _warn = console.warn.bind(console);
    const _error = console.error.bind(console);
    function forward(level, args) {
      const msg = Array.from(args).map(function(a) {
        try { return typeof a === 'object' ? JSON.stringify(a) : String(a); }
        catch(e) { return String(a); }
      }).join(' ');
      const ev = { type: 'log', level: level, text: level + ': ' + msg };
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge) {
        window.webkit.messageHandlers.bridge.postMessage(JSON.stringify(ev));
      }
    }
    console.log   = function() { _log.apply(console, arguments); forward('log', arguments); };
    console.warn  = function() { _warn.apply(console, arguments); forward('warn', arguments); };
    console.error = function() { _error.apply(console, arguments); forward('error', arguments); };
    window.onerror = function(msg, url, line, col, err) {
      var text = 'error: ' + msg + ' at ' + url + ':' + line + ':' + col;
      if (err && err.stack) text += '\n' + err.stack;
      _error(msg);
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge) {
        window.webkit.messageHandlers.bridge.postMessage(JSON.stringify({ type: 'log', level: 'error', text: text }));
      }
    };
  })();
  </script>

  <script type="module">
    import * as THREE from './js/three.module.js';
    import { GLTFLoader } from './js/addons/loaders/GLTFLoader.js';
    import { FBXLoader } from './js/addons/loaders/FBXLoader.js';
    import { mixamoVRMRigMap } from './js/mixamoVRMRigMap.js';
    import { OrbitControls } from './js/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin, VRMUtils } from './js/three-vrm.module.js';

    // ─── Globals ────────────────────────────────────────────
    let vrm = null;
    let clock = new THREE.Clock();
    let currentMode = 'idle';
    let currentEmotion = 'neutral';
    let isSpeaking = false;

    const emotionMorphNames = {
      happy:     ['Face_Blendshape.Fcl_BRW_Joy',      'Face_Blendshape.Fcl_EYE_Joy'],
      angry:     ['Face_Blendshape.Fcl_BRW_Angry',    'Face_Blendshape.Fcl_EYE_Angry'],
      sad:       ['Face_Blendshape.Fcl_BRW_Sorrow',   'Face_Blendshape.Fcl_EYE_Sorrow'],
      surprised: ['Face_Blendshape.Fcl_BRW_Surprised','Face_Blendshape.Fcl_EYE_Surprised'],
      relaxed:   ['Face_Blendshape.Fcl_BRW_Fun',      'Face_Blendshape.Fcl_EYE_Fun'],
    };
    let faceMesh = null;
    let faceMeshes = [];
    let emotionMorphMap = {};
    let managedEmotionIndices = [];

    let visemeTargets = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
    let visemeCurrent = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
    let visemeBlendSpeed = 8.0;

    let pendingTimeline = null;

    let blinkTimer = 0;
    let blinkInterval = 3.0;
    let blinkValue = 0;
    let blinkPhase = 'open';
    let idleTime = 0;

    const AVATAR_Y = -0.95;

    const avatarBounds = { worldW: 1.1, worldH: 1.7, worldCenter: new THREE.Vector3(0, 0.85, 0) };

    // ─── FBX Animation System ────────────────────────────────
    let mixer = null;              // THREE.AnimationMixer
    let animationMap = new Map();  // name → THREE.AnimationAction
    let currentAnimation = null;   // currently playing action name
    const animCrossFadeDuration = 0.35; // seconds for cross-fade

    // Idle animation system: after IDLE_ANIM_DELAY seconds of idle, randomly
    // play FBX animations. When the user interacts, stop and restore the
    // default standing pose.
    const IDLE_ANIM_DELAY = 10; // seconds before starting idle animations
    let idleAnimTimer = 0;     // counts up when in idle mode with no animation
    let idleAnimActive = false; // true when random idle animations are playing
    let idleAnimNextSwitch = 0; // time when we should switch to the next random anim

    // Idle animation pool — all 11 FBX animations for random idle playback.
    const idleAnimPool = [
      'Bored', 'CrossJumps', 'FightIdle', 'JumpingRope', 'Looking',
      'LookingAround', 'MagicSpellCasting', 'OffensiveIdle',
      'SearchingFilesHigh', 'StandingMagicAttack', 'TextingWhileStanding'
    ];

    // FBX animation toggle — read from URL query parameter.
    // Defaults to true (enabled). Set enable_fbx=0 to disable.
    const enableFBX = !(new URLSearchParams(window.location.search).get('enable_fbx') === '0');

    // ─── Three.js Setup ─────────────────────────────────────
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    console.log('[diag] isWebGL2=' + renderer.capabilities.isWebGL2 + ', ua=' + navigator.userAgent);

    // iOS 14 is WebGL1-only; three r160 cannot render skinned meshes there,
    // so the VRM avatar is unavailable. Fall back to the built-in placeholder
    // character. iOS 15+ (WebGL2) gets the real VRM avatar + FBX animations.
    let webgl2Unsupported = false;
    if (!renderer.capabilities.isWebGL2) {
      webgl2Unsupported = true;
      console.error('[fallback] WebGL2 not supported (need iOS 15+); using placeholder avatar');
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x1A1A2E, 1.0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 0.9, 3.5);
    camera.lookAt(0, 0.7, 0);

    // ─── Orbit camera (touch: 1-finger rotate, 2-finger pinch zoom) ──────
    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 0.5, 0); // refined by fitCameraToWindow()
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false; // keep the avatar centered
    controls.rotateSpeed = 0.7;
    controls.zoomSpeed = 0.6;
    controls.minPolarAngle = 0.05;   // don't go under the floor
    controls.maxPolarAngle = Math.PI * 0.6; // don't go top-down
    controls.minDistance = 2.0;
    controls.maxDistance = 14.0;

    // ─── Lighting ───────────────────────────────────────────
    scene.add(new THREE.AmbientLight('#ffffff', 0.8));

    const keyLight = new THREE.DirectionalLight('#ffffff', 0.8);
    keyLight.position.set(1.5, 2.5, 2);
    keyLight.target.position.set(0, -0.5, 0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 0.1;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.camera.left = -3;
    keyLight.shadow.camera.right = 3;
    keyLight.shadow.camera.top = 3;
    keyLight.shadow.camera.bottom = -3;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);
    scene.add(keyLight.target);

    const fillLight = new THREE.DirectionalLight('#d0e8ff', 0.4);
    fillLight.position.set(-1, 0.3, -0.5);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight('#ffffff', 0.3);
    rimLight.position.set(0.3, 1.5, -2.5);
    scene.add(rimLight);

    // ─── Ground shadow disc ─────────────────────────────────
    const groundY = AVATAR_Y;
    const shadowDisc = new THREE.Mesh(
      new THREE.CircleGeometry(8, 48),
      new THREE.ShadowMaterial({ opacity: 0.3 })
    );
    shadowDisc.rotation.x = -Math.PI / 2;
    shadowDisc.position.y = groundY;
    shadowDisc.receiveShadow = true;
    scene.add(shadowDisc);

    const gridHelper = new THREE.GridHelper(20, 40, 0x888888, 0xcccccc);
    gridHelper.position.y = groundY;
    gridHelper.material.opacity = 0.18;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // ─── Load VRM ───────────────────────────────────────────
    async function loadVRM(url) {
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));

      const gltf = await loader.loadAsync(url);
      vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      VRMUtils.rotateVRM0(vrm);

      // Fix arms and fingers to natural standing pose (not T-pose).
      restoreDefaultPose();

      scene.add(vrm.scene);
      vrm.scene.position.set(0, AVATAR_Y, 0);

      vrm.scene.traverse((obj) => {
        if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; }
      });

      if (vrm.expressionManager) {
        vrm.expressionManager.setValue('blink', 0);
        vrm.expressionManager.setValue('blinkLeft', 0);
        vrm.expressionManager.setValue('blinkRight', 0);
      }

      console.log('VRM loaded:', vrm.meta?.metaVersion);
      console.log('Expressions:', Object.keys(vrm.expressionManager?.expressionMap || {}));
      console.log('Window size:', window.innerWidth, 'x', window.innerHeight);

      buildEmotionMorphMap();

      // Load FBX animations and initialize the mixer (if enabled).
      if (enableFBX) {
        loadFBXAnimations().then(() => {
          initAnimationMixer();
        });
      } else {
        console.log('[FBX] FBX animation disabled by config (enable_fbx=0)');
      }

      // Fit camera to the VRM model on mobile.
      setTimeout(() => {
        fitCameraToWindow();
        console.log('[INFO] Camera fitted: dist=', camera.position.z.toFixed(1), 'fov=', camera.fov);
      }, 100);

      setTimeout(() => {
        canvas.classList.add('visible');
        hideLoading();
        console.log('[INFO] VRM model ready');
      }, 300);
    }

    // Restore arms and fingers to the natural standing pose (not T-pose).
    function restoreDefaultPose() {
      if (!vrm?.humanoid) return;
      const down = 77.4 * (Math.PI / 180);
      const s = Math.sin(down / 2);
      const c = Math.cos(down / 2);
      const eS = Math.sin(4 * (Math.PI / 180));
      const eC = Math.cos(4 * (Math.PI / 180));

      // Build the full normalized pose: arms + fingers + reset all other bones.
      const pose = {
        leftUpperArm:  { rotation: [0, 0, -s, c] },
        rightUpperArm: { rotation: [0, 0,  s, c] },
        leftLowerArm:  { rotation: [0, 0,  eS, eC] },
        rightLowerArm: { rotation: [0, 0, -eS, eC] },
      };

      // Reset all finger bones to identity (T-pose), then add curl.
      const fingerBones = [
        'leftThumbMetacarpal','leftThumbProximal','leftThumbIntermediate','leftThumbDistal',
        'leftIndexProximal','leftIndexIntermediate','leftIndexDistal',
        'leftMiddleProximal','leftMiddleIntermediate','leftMiddleDistal',
        'leftRingProximal','leftRingIntermediate','leftRingDistal',
        'leftLittleProximal','leftLittleIntermediate','leftLittleDistal',
        'rightThumbMetacarpal','rightThumbProximal','rightThumbIntermediate','rightThumbDistal',
        'rightIndexProximal','rightIndexIntermediate','rightIndexDistal',
        'rightMiddleProximal','rightMiddleIntermediate','rightMiddleDistal',
        'rightRingProximal','rightRingIntermediate','rightRingDistal',
        'rightLittleProximal','rightLittleIntermediate','rightLittleDistal',
      ];
      const identity = [0, 0, 0, 1];
      for (const name of fingerBones) {
        pose[name] = { rotation: identity };
      }

      // Apply finger curl as quaternion rotations around the local Z axis.
      const fingerCurl = {
        index:  { proximal: 0.15, intermediate: 0.25, distal: 0.15 },
        middle: { proximal: 0.12, intermediate: 0.20, distal: 0.12 },
        ring:   { proximal: 0.18, intermediate: 0.28, distal: 0.18 },
        little: { proximal: 0.22, intermediate: 0.35, distal: 0.22 },
      };
      const thumbCurl = { meta: 0.10, prox: 0.15, inter: 0.10, dist: 0.08 };

      const sides = ['left', 'right'];
      for (const side of sides) {
        const curlDir = side === 'left' ? -1 : 1;

        for (const [finger, angles] of Object.entries(fingerCurl)) {
          const cap = finger.charAt(0).toUpperCase() + finger.slice(1);
          for (const [joint, angle] of Object.entries(angles)) {
            const jointName = joint.charAt(0).toUpperCase() + joint.slice(1);
            const boneName = side + cap + jointName;
            const a = curlDir * angle;
            const hs = Math.sin(a / 2);
            const hc = Math.cos(a / 2);
            pose[boneName] = { rotation: [0, 0, hs, hc] };
          }
        }

        // Thumb
        pose[side + 'ThumbMetacarpal']    = { rotation: [0, 0, Math.sin(curlDir * thumbCurl.meta / 2),  Math.cos(curlDir * thumbCurl.meta / 2)] };
        pose[side + 'ThumbProximal']      = { rotation: [0, 0, Math.sin(curlDir * thumbCurl.prox / 2),  Math.cos(curlDir * thumbCurl.prox / 2)] };
        pose[side + 'ThumbIntermediate']  = { rotation: [0, 0, Math.sin(curlDir * thumbCurl.inter / 2), Math.cos(curlDir * thumbCurl.inter / 2)] };
        pose[side + 'ThumbDistal']        = { rotation: [0, 0, Math.sin(curlDir * thumbCurl.dist / 2),  Math.cos(curlDir * thumbCurl.dist / 2)] };
      }

      vrm.humanoid.setNormalizedPose(pose);
    }

    function buildEmotionMorphMap() {
      faceMesh = null;
      faceMeshes = [];
      emotionMorphMap = {};
      managedEmotionIndices = [];

      if (!vrm?.scene) return;

      vrm.scene.traverse((obj) => {
        if (obj.isMesh && typeof obj.name === 'string' && obj.name.startsWith('Face')) {
          if (!faceMesh && obj.morphTargetDictionary) faceMesh = obj;
          faceMeshes.push(obj);
        }
      });

      if (!faceMesh || !faceMesh.morphTargetDictionary) {
        console.warn('[emotion] Face mesh or morphTargetDictionary not found');
        return;
      }

      for (const [emotion, names] of Object.entries(emotionMorphNames)) {
        const binds = [];
        for (const name of names) {
          const idx = faceMesh.morphTargetDictionary[name];
          if (idx === undefined) continue;
          binds.push(idx);
          managedEmotionIndices.push(idx);
        }
        if (binds.length) emotionMorphMap[emotion] = binds;
      }
    }

    function updateEmotionMorphs() {
      if (!faceMeshes.length) return;
      const binds = emotionMorphMap[currentEmotion];

      for (const mesh of faceMeshes) {
        if (!mesh.morphTargetInfluences) continue;
        for (const idx of managedEmotionIndices) {
          mesh.morphTargetInfluences[idx] = 0;
        }
        if (!binds) continue;
        for (const idx of binds) {
          mesh.morphTargetInfluences[idx] = 1.0;
        }
      }
    }

    // ─── Placeholder avatar (fallback) ──────────────────────
    function createPlaceholderAvatar() {
      const group = new THREE.Group();
      const bodyGeo = new THREE.CapsuleGeometry(0.22, 0.5, 8, 16);
      const bodyMat = new THREE.MeshStandardMaterial({ color: '#4a6fa5', roughness: 0.3 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.75;
      body.castShadow = true;
      group.add(body);

      const headGroup = new THREE.Group();
      headGroup.position.y = 1.25;
      const headGeo = new THREE.SphereGeometry(0.2, 32, 32);
      const headMat = new THREE.MeshStandardMaterial({ color: '#f5e6d3', roughness: 0.4 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.castShadow = true;
      headGroup.add(head);

      const eyeGeo = new THREE.SphereGeometry(0.045, 16, 16);
      const eyeMat = new THREE.MeshStandardMaterial({ color: '#111111', roughness: 0.1 });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.07, 0.04, -0.17);
      headGroup.add(leftEye);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.07, 0.04, -0.17);
      headGroup.add(rightEye);

      const mouthGeo = new THREE.BoxGeometry(0.1, 0.02, 0.01);
      const mouthMat = new THREE.MeshStandardMaterial({ color: '#cc4444', roughness: 0.3 });
      const mouth = new THREE.Mesh(mouthGeo, mouthMat);
      mouth.position.set(0, -0.06, -0.18);
      mouth.name = 'mouth';
      headGroup.add(mouth);

      group.add(headGroup);
      group.position.set(0, AVATAR_Y, 0);
      scene.add(group);

      window._placeholder = { group, headGroup, mouth, leftEye, rightEye };
      console.log('Placeholder avatar created');

      // Show a hint in the subtitle so the user knows why the avatar is simplified.
      const subtitleEl = document.getElementById('subtitle');
      if (webgl2Unsupported) {
        subtitleEl.textContent = '系统版本低于 iOS 15，已使用简易形象';
      } else {
        subtitleEl.textContent = 'VRM 模型加载失败，已使用简易形象';
      }
      subtitleEl.classList.remove('hidden');

      setTimeout(() => {
        canvas.classList.add('visible');
        hideLoading();
      }, 300);
    }

    async function initAvatar() {
      try {
        await loadVRM('./models/avatar.vrm');
      } catch (err) {
        console.error('VRM load failed:', err.message);
        console.warn('Falling back to placeholder avatar...');
        createPlaceholderAvatar();
      }
    }

    // ─── Animation Loop ─────────────────────────────────────
    // Visibility-aware render loop: pauses when the page is hidden to save
    // GPU/battery, and resets the clock on resume to avoid huge delta spikes.
    let animRunning = false;
    let animFrameId = 0;
    function animate() {
      animFrameId = requestAnimationFrame(animate);

      try {
        const dt = Math.min(clock.getDelta(), 0.1);
        idleTime += dt;

        // Update FBX animation mixer (retargeted skeleton animation).
        if (mixer) {
          mixer.update(dt);
        }

        if (vrm) {
          updateVRMBlink(dt);
          updateVRMVisemes(dt);
          updateVRMIdleMicro(dt);
          vrm.update(dt);
          updateEmotionMorphs();

          // Idle animation timer: start random FBX animations after a delay.
          if (currentMode === 'idle' && mixer && animationMap.size > 0) {
            if (!idleAnimActive && !isSpeaking) {
              idleAnimTimer += dt;
              if (idleAnimTimer >= IDLE_ANIM_DELAY) {
                startIdleAnimations();
              }
            }
            // Rotate to next random animation when the current one's time is up.
            if (idleAnimActive && idleAnimNextSwitch > 0 && idleTime >= idleAnimNextSwitch) {
              playRandomIdleAnim();
            }
          }
        } else if (window._placeholder) {
          updatePlaceholderBlink(dt);
          updatePlaceholderMouth(dt);
          updatePlaceholderIdle(dt);
        }

        controls.update(); // applies orbit damping
        renderer.render(scene, camera);
        frameCount++;
      } catch (e) {
        console.error('[ERROR] animate crashed:', e.message, e.stack);
        frameCount = -1;
      }
    }

    function stopAnimLoop() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      animFrameId = 0;
      animRunning = false;
    }

    function startAnimLoop() {
      if (animRunning) return;
      animRunning = true;
      clock.getDelta(); // reset delta so resume doesn't jump
      animate();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopAnimLoop();
        if (mixer) mixer.stopAllAction();
      } else {
        startAnimLoop();
      }
    });

    let frameCount = 0;
    // Log first frame confirmation.
    setTimeout(function() {
      console.log('[INFO] Rendered frames: ' + frameCount +
                  ', vrm=' + !!vrm +
                  ', placeholder=' + !!window._placeholder +
                  ', canvasOpacity=' + canvas.style.opacity +
                  ', canvasVisible=' + canvas.classList.contains('visible'));
    }, 1200);

    // Global error handlers.
    window.addEventListener('error', function(e) {
      console.error('[JS GLOBAL ERROR]', e.message, e.filename, e.lineno);
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('[JS UNHANDLED REJECTION]', e.reason);
    });

    // ─── VRM Blink ─────────────────────────────────────────
    function updateVRMBlink(dt) {
      if (vrm.expressionManager && blinkValue > 0.001) {
        vrm.expressionManager.setValue('blink', blinkValue);
      }

      if (blinkPhase === 'open') {
        blinkTimer += dt;
        if (blinkTimer > blinkInterval) {
          blinkPhase = 'closing';
          blinkTimer = 0;
          blinkInterval = 2.5 + Math.random() * 4.0;
        }
        return;
      }

      if (blinkPhase === 'closing') {
        blinkValue += dt * 12;
        if (blinkValue >= 1.0) {
          blinkValue = 1.0;
          blinkPhase = 'closed';
          blinkTimer = 0;
        }
        return;
      }

      if (blinkPhase === 'closed') {
        blinkTimer += dt;
        if (blinkTimer > 0.12) {
          blinkPhase = 'opening';
        }
        return;
      }

      if (blinkPhase === 'opening') {
        blinkValue -= dt * 12;
        if (blinkValue <= 0) {
          blinkValue = 0;
          blinkPhase = 'open';
          blinkTimer = 0;
        }
        return;
      }
    }

    // ─── VRM Visemes (lip-sync) ─────────────────────────────
    function updateVRMVisemes(dt) {
      if (!vrm?.expressionManager) return;

      const visemeNames = ['aa', 'ih', 'ou', 'ee', 'oh'];
      const lerp = Math.min(visemeBlendSpeed * dt, 1.0);

      for (const name of visemeNames) {
        visemeCurrent[name] += (visemeTargets[name] - visemeCurrent[name]) * lerp;
        vrm.expressionManager.setValue(name, visemeCurrent[name]);
      }
    }

    // ─── VRM Idle micro-movement ────────────────────────────
    function updateVRMIdleMicro(dt) {
      if (currentMode !== 'idle') return;
      if (!vrm?.scene) return;
      // When FBX idle animation is playing, the animation drives body movement.
      if (idleAnimActive) return;

      const t = idleTime;
      const breathe = Math.sin(t * 1.4) * 0.008;
      vrm.scene.position.y = AVATAR_Y + breathe;
      vrm.scene.position.x = Math.sin(t * 0.7) * 0.015;
      vrm.scene.rotation.z = Math.sin(t * 0.7) * 0.015;
      vrm.scene.rotation.y = Math.sin(t * 0.4) * 0.18;

      visemeTargets['aa'] = 0.04 + Math.sin(t * 1.4) * 0.01;
    }

    // ─── Placeholder animations ─────────────────────────────
    let placeholderBlink = 0;
    let placeholderBlinking = false;
    let placeholderBlinkTimer = 0;

    function updatePlaceholderBlink(dt) {
      const { leftEye, rightEye } = window._placeholder;
      placeholderBlinkTimer += dt;
      const blinkInterval = 3.0;

      if (!placeholderBlinking && placeholderBlinkTimer > blinkInterval) {
        placeholderBlinking = true;
        placeholderBlink = 0;
      }

      if (placeholderBlinking) {
        placeholderBlink += dt * 10;
        if (placeholderBlink >= 1.0) {
          placeholderBlinkTimer += dt;
          if (placeholderBlinkTimer > 0.15) {
            placeholderBlink -= dt * 10;
            if (placeholderBlink <= 0) {
              placeholderBlink = 0;
              placeholderBlinking = false;
              placeholderBlinkTimer = 0;
            }
          }
        }
      }

      const eyeScale = 1 - placeholderBlink * 0.9;
      leftEye.scale.y = eyeScale;
      rightEye.scale.y = eyeScale;
    }

    let placeholderMouthTime = 0;
    function updatePlaceholderMouth(dt) {
      const { mouth } = window._placeholder;
      if (!mouth) return;

      if (isSpeaking) {
        placeholderMouthTime += dt;
        const openness = 0.5 + 0.5 * Math.sin(placeholderMouthTime * 12);
        mouth.scale.y = 0.3 + openness * 8;
        mouth.position.y = -0.06 - openness * 0.04;
      } else {
        mouth.scale.y = 0.3;
        mouth.position.y = -0.06;
      }
    }

    function updatePlaceholderIdle(dt) {
      if (currentMode !== 'idle') return;
      const { group } = window._placeholder;
      if (!group) return;
      const t = idleTime;
      group.position.y = AVATAR_Y + Math.sin(t * 1.4) * 0.005;
      group.position.x = Math.sin(t * 0.7) * 0.01;
      group.rotation.z = Math.sin(t * 0.7) * 0.01;
    }

    // ─── Subtitle UI ──────────────────────────────────────────
    // Max display length per subtitle line, counted in Unicode code points
    // (not bytes / UTF-16 units) so CJK chars and emoji are never split.
    const MAX_SPEAK_CHARS = 18;   // 22px speaking subtitle
    const MAX_USER_CHARS = 26;    // 15px user subtitle

    function truncateByChars(text, maxChars) {
      const chars = Array.from(text); // iterates by code point, not code unit
      if (chars.length <= maxChars) return text;
      return chars.slice(0, maxChars).join('') + '…';
    }

    function updateSubtitle(text) {
      const el = document.getElementById('subtitle');
      if (text && text.length > 0) {
        el.textContent = truncateByChars(text, MAX_SPEAK_CHARS);
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }

    function updateUserSubtitle(text) {
      const el = document.getElementById('userSubtitle');
      if (text && text.length > 0) {
        el.textContent = truncateByChars(text, MAX_USER_CHARS);
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }

    // ─── JS Bridge: Receive messages from Swift ─────────────
    window._realHandleMessage = function(jsonStr) {
      try {
        const msg = JSON.parse(jsonStr);
        if (msg.cmd === 'fade_out') {
          fadeOutAvatar();
          return;
        }
        if (msg.type === 'viseme_timeline') {
          if (currentMode === 'speaking') {
            playVisemeTimeline(msg.timeline);
          } else {
            pendingTimeline = msg.timeline;
          }
          return;
        }
        if (msg.type === 'viseme') {
          applyViseme(msg.viseme, msg.weight);
          return;
        }
        if (msg.mode) {
          const prevMode = currentMode;
          currentMode = msg.mode;
          isSpeaking = msg.isSpeaking || false;
          if (msg.emotion) currentEmotion = msg.emotion;
          updateSubtitle(msg.speakingText);
          updateUserSubtitle(msg.userText || '');

          // Stop idle FBX animations when entering conversation modes, and
          // only reset the idle countdown on an actual mode *transition*.
          // Swift pushes a "idle" state every time blink/antic mutates
          // RobotState (every 2–5s); resetting the timer unconditionally
          // would keep the 10s idle timer from ever elapsing.
          if (currentMode !== 'idle') {
            stopIdleAnimations();
            idleAnimTimer = 0;
          } else if (prevMode !== 'idle') {
            // Fresh countdown when returning to idle from another mode.
            idleAnimTimer = 0;
          }

          if (currentMode === 'speaking' && pendingTimeline) {
            playVisemeTimeline(pendingTimeline);
            pendingTimeline = null;
          } else if (currentMode !== 'speaking') {
            pendingTimeline = null;
          }
          applyModeToVRM();
        }
      } catch (e) {
        console.error('handleMessage error:', e);
      }
    };

    // ─── Play viseme timeline ────────────────────────────────
    let visemeTimers = [];
    function playVisemeTimeline(timeline) {
      if (!timeline || !timeline.length) return;
      clearVisemeTimers();

      const start = performance.now();

      for (const entry of timeline) {
        const delay = Math.max(0, entry.startMs - (performance.now() - start));
        const timer = setTimeout(() => {
          if (entry.viseme === 'rest' || !entry.viseme) {
            applyViseme('rest', 0);
          } else {
            applyViseme(entry.viseme, 1.0);
          }
        }, delay);
        visemeTimers.push(timer);
      }

      const lastStart = timeline.length > 0 ? timeline[timeline.length - 1].startMs : 0;
      const resetTimer = setTimeout(() => {
        applyViseme('rest', 0);
      }, lastStart + 200);
      visemeTimers.push(resetTimer);
    }

    function applyViseme(viseme, weight) {
      if (!vrm?.expressionManager) return;
      const mouthVisemes = ['aa', 'ih', 'ou', 'ee', 'oh'];

      if (viseme === 'rest' || !viseme) {
        for (const name of mouthVisemes) {
          visemeTargets[name] = 0;
        }
        return;
      }

      for (const name of mouthVisemes) {
        visemeTargets[name] = (name === viseme) ? weight : 0;
      }
    }

    function clearVisemeTimers() {
      for (const t of visemeTimers) clearTimeout(t);
      visemeTimers = [];
    }

    function applyModeToVRM() {
      if (!vrm?.expressionManager) return;
      if (!isSpeaking) {
        applyViseme('rest', 0);
      }
    }

    // ─── FBX Animation Loading & Retargeting ─────────────────
    // Same approach as the desktop/Android version: Mixamo FBX → VRM skeleton
    // via quaternion-space retargeting (mixamoVRMRigMap).

    // Stores loaded but not-yet-retargeted clips (name → AnimationClip).
    let rawClipMap = new Map();

    // Load all FBX animations from /models/animations/.
    async function loadFBXAnimations() {
      const animNames = [
        'Bored', 'CrossJumps', 'FightIdle', 'JumpingRope', 'Looking',
        'LookingAround', 'MagicSpellCasting', 'OffensiveIdle',
        'SearchingFilesHigh', 'StandingMagicAttack', 'TextingWhileStanding'
      ];

      const fbxLoader = new FBXLoader();
      const results = await Promise.allSettled(
        animNames.map(name =>
          fbxLoader.loadAsync(`./models/animations/${name}.fbx`)
            .then(group => ({ name, group }))
        )
      );

      for (const result of results) {
        if (result.status !== 'fulfilled') {
          console.warn('FBX load failed:', result.reason?.message);
          continue;
        }
        const { name, group } = result.value;
        const clips = group.animations;
        if (!clips || clips.length === 0) {
          console.warn(`FBX ${name}: no animation clips found`);
          continue;
        }

        // Store the raw clip + its FBX group for retargeting.
        rawClipMap.set(name, { clip: clips[0], group });
        console.log(`FBX loaded: ${name} (${clips[0].duration.toFixed(1)}s)`);
      }

      console.log(`FBX animations loaded: ${rawClipMap.size}/${animNames.length}`);
    }

    // Retarget a single Mixamo AnimationClip to the VRM skeleton using the
    // official three-vrm approach (quaternion space transform).
    function retargetMixamoClip(rawClip, fbxGroup, vrm) {
      const clip = rawClip;

      const tracks = [];

      const restRotationInverse = new THREE.Quaternion();
      const parentRestWorldRotation = new THREE.Quaternion();
      const _quatA = new THREE.Quaternion();

      // Adjust position with reference to hips height.
      const motionHipsNode = fbxGroup.getObjectByName('mixamorigHips');
      const motionHipsHeight = motionHipsNode ? motionHipsNode.position.y : 0;
      const vrmHipsY = vrm.humanoid.normalizedRestPose.hips.position[1];
      const hipsPositionScale = vrmHipsY / (motionHipsHeight || 1);

      clip.tracks.forEach((track) => {
        const trackSplitted = track.name.split('.');
        const mixamoRigName = trackSplitted[0];
        const vrmBoneName = mixamoVRMRigMap[mixamoRigName];
        const vrmNodeName = vrm.humanoid?.getNormalizedBoneNode(vrmBoneName)?.name;
        const mixamoRigNode = fbxGroup.getObjectByName(mixamoRigName);

        if (vrmNodeName != null && mixamoRigNode != null) {
          const propertyName = trackSplitted[1];

          // Store rest-pose world rotations.
          mixamoRigNode.getWorldQuaternion(restRotationInverse).invert();
          mixamoRigNode.parent.getWorldQuaternion(parentRestWorldRotation);

          if (track instanceof THREE.QuaternionKeyframeTrack) {
            for (let i = 0; i < track.values.length; i += 4) {
              const flatQuaternion = track.values.slice(i, i + 4);
              _quatA.fromArray(flatQuaternion);
              _quatA.premultiply(parentRestWorldRotation).multiply(restRotationInverse);
              _quatA.toArray(flatQuaternion);
              flatQuaternion.forEach((v, index) => {
                track.values[index + i] = v;
              });
            }

            tracks.push(
              new THREE.QuaternionKeyframeTrack(
                `${vrmNodeName}.${propertyName}`,
                track.times,
                track.values.map((v, i) => (
                  vrm.meta?.metaVersion === '0' && i % 2 === 0 ? -v : v
                )),
              ),
            );
          } else if (track instanceof THREE.VectorKeyframeTrack) {
            const value = track.values.map(
              (v, i) => (vrm.meta?.metaVersion === '0' && i % 3 !== 1 ? -v : v) * hipsPositionScale
            );
            tracks.push(new THREE.VectorKeyframeTrack(`${vrmNodeName}.${propertyName}`, track.times, value));
          }
        }
      });

      return new THREE.AnimationClip('vrmAnimation', clip.duration, tracks);
    }

    // Create the AnimationMixer and retarget all loaded clips.
    function initAnimationMixer() {
      if (!vrm?.scene) return;
      if (rawClipMap.size === 0) return;

      mixer = new THREE.AnimationMixer(vrm.scene);

      for (const [name, { clip, group }] of rawClipMap) {
        const retargetedClip = retargetMixamoClip(clip, group, vrm);
        const action = mixer.clipAction(retargetedClip);
        action.setLoop(THREE.LoopRepeat);
        action.clampWhenFinished = false;
        animationMap.set(name, action);
      }

      // Free raw clip data (no longer needed).
      rawClipMap.clear();

      console.log(`[FBX] AnimationMixer initialized with ${animationMap.size} actions`);
      console.log(`[FBX] 空闲动画将在 ${IDLE_ANIM_DELAY}s 后开始随机播放`);
    }

    // ─── Idle Animation Control ─────────────────────────────
    // Start playing random idle animations. Called when the idle timer expires.
    function startIdleAnimations() {
      if (idleAnimActive) return;
      if (!mixer || animationMap.size === 0) return;
      idleAnimActive = true;
      playRandomIdleAnim();
      console.log('[FBX] 空闲动画开始播放');
    }

    // Stop all animations and restore the default standing pose.
    function stopIdleAnimations() {
      if (!idleAnimActive) return;
      idleAnimActive = false;
      idleAnimNextSwitch = 0;

      // Fade out all running actions, then restore the default pose.
      if (mixer && currentAnimation) {
        const action = animationMap.get(currentAnimation);
        if (action && action.isRunning()) {
          action.fadeOut(animCrossFadeDuration);
        }
      }
      currentAnimation = null;

      // Defer pose restore until after the fadeOut completes.
      setTimeout(() => {
        if (!idleAnimActive) {
          restoreDefaultPose();
        }
      }, animCrossFadeDuration * 1000 + 50);

      console.log('[FBX] 空闲动画停止, 恢复默认站姿');
    }

    // Pick and play a random animation from the idle pool.
    function playRandomIdleAnim() {
      if (!mixer || !idleAnimActive) return;

      // Pick a random animation different from the current one.
      let pool = idleAnimPool;
      if (currentAnimation && pool.length > 1) {
        pool = pool.filter(n => n !== currentAnimation);
      }
      const animName = pool[Math.floor(Math.random() * pool.length)];
      const action = animationMap.get(animName);
      if (!action) return;

      const prevAction = currentAnimation ? animationMap.get(currentAnimation) : null;
      currentAnimation = animName;

      if (prevAction && prevAction.isRunning()) {
        action.reset().play();
        action.crossFadeFrom(prevAction, animCrossFadeDuration, true);
      } else {
        action.reset().play();
        action.setEffectiveWeight(1.0);
      }

      // Schedule next switch: play for 4-8 seconds.
      const duration = 4 + Math.random() * 4;
      idleAnimNextSwitch = idleTime + duration;
      console.log(`[FBX] 播放动画: ${animName} (${duration.toFixed(1)}s)`);
    }

    // ─── Fit camera to model bounding box ─────────────────────
    function fitCameraToWindow() {
      const box = new THREE.Box3();
      scene.traverse(function(obj) {
        if (!obj.isMesh || obj === shadowDisc || obj === gridHelper) return;
        box.expandByObject(obj);
      });
      if (box.isEmpty()) {
        console.log('[INFO] Camera: box is empty, using default');
        return;
      }

      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);

      avatarBounds.worldW = size.x;
      avatarBounds.worldH = size.y;
      avatarBounds.worldCenter.copy(center);

      console.log('[INFO] Model bounds: w=' + size.x.toFixed(2) + ' h=' + size.y.toFixed(2) +
                  ' center=(' + center.x.toFixed(2) + ',' + center.y.toFixed(2) + ',' + center.z.toFixed(2) + ')');

      // Fit so model fills ~75% of window height.
      const margin = 1.33;
      const fovRad = camera.fov * Math.PI / 180;
      const winH = window.innerHeight;
      const winW = window.innerWidth;
      const aspect = winW / Math.max(winH, 1);

      const distH = (avatarBounds.worldW * margin) / (2 * Math.tan(fovRad / 2) * aspect);
      const distV = (avatarBounds.worldH * margin) / (2 * Math.tan(fovRad / 2));
      const dist = Math.max(distH, distV);

      camera.position.set(center.x, center.y, center.z + dist);
      camera.lookAt(center.x, center.y, center.z);
      camera.near = Math.max(0.01, dist * 0.1);
      camera.updateProjectionMatrix();

      // Sync the orbit controls to the fitted view.
      controls.target.copy(center);
      controls.minDistance = Math.max(1.5, dist * 0.35);
      controls.maxDistance = dist * 2.4;
      controls.update();

      console.log('[INFO] Camera: dist=' + dist.toFixed(1) + ' pos=(' +
                  camera.position.x.toFixed(1) + ',' + camera.position.y.toFixed(1) + ',' +
                  camera.position.z.toFixed(1) + ') aspect=' + aspect.toFixed(2));
    }

    // ─── JS Bridge: Send events to Swift ────────────────────
    function sendEvent(type, data) {
      const msg = JSON.stringify({ type, data });
      // iOS WKWebView path
      if (window.webkit?.messageHandlers?.bridge) {
        window.webkit.messageHandlers.bridge.postMessage(msg);
      }
      console.log('sendEvent:', type, data);
    }

    function fadeOutAvatar() {
      canvas.classList.add('fading');
    }

    function hideLoading() {
      const el = document.getElementById('loading');
      if (el) el.classList.add('hidden');
    }

    // ─── Input: touch handling ────────────────────────────────
    // Tap detection: touchstart + touchend with a small drag threshold.
    // Long-press detection: 600ms hold without moving.
    // OrbitControls handles rotation (1-finger) and pinch-zoom (2-finger).
    let tapState = null;
    let longPressTimer = null;

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) { tapState = null; clearLongPress(); return; }
      tapState = {
        startX: e.touches[0].screenX,
        startY: e.touches[0].screenY,
        moved: false,
      };
      // Start long-press timer (600ms)
      clearLongPress();
      longPressTimer = setTimeout(() => {
        if (tapState && !tapState.moved) {
          console.log('[INPUT] 长按 (long-press)');
          sendEvent('long_press', {});
          tapState = null;
        }
      }, 600);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!tapState || e.touches.length !== 1) { clearLongPress(); tapState = null; return; }
      if (!tapState.moved &&
          (Math.abs(e.touches[0].screenX - tapState.startX) > 8 ||
           Math.abs(e.touches[0].screenY - tapState.startY) > 8)) {
        tapState.moved = true;
        clearLongPress();
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      clearLongPress();
      if (!tapState) return;
      const wasDrag = tapState.moved;
      tapState = null;
      if (!wasDrag) {
        console.log('[INPUT] 触摸点击 (tap)');
        sendEvent('tap', {});
      }
    });

    canvas.addEventListener('touchcancel', () => {
      clearLongPress();
      tapState = null;
    });

    function clearLongPress() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    // ─── Resize Handler ─────────────────────────────────────
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      fitCameraToWindow();
      if (vrm) {
        vrm.scene.position.set(0, AVATAR_Y, 0);
      } else if (window._placeholder) {
        window._placeholder.group.position.set(0, AVATAR_Y, 0);
      }
    });

    // ─── Start ──────────────────────────────────────────────
    if (webgl2Unsupported) {
      createPlaceholderAvatar();
      startAnimLoop();
    } else {
      initAvatar().then(() => {
        startAnimLoop();
      });
    }

    // Fallback: force-start the render loop even if initAvatar never resolves.
    setTimeout(() => {
      if (frameCount === 0 && !vrm && !window._placeholder) {
        console.error('[FALLBACK] initAvatar never completed, forcing placeholder');
        createPlaceholderAvatar();
        startAnimLoop();
      }
    }, 8000);

    // ─── Bridge: swap in the real handler and flush pending messages ───
    const pending = window._pendingMessages || [];
    window.handleMessage = function(jsonStr) {
      window._realHandleMessage(jsonStr);
    };
    if (pending.length > 0) {
      console.log('[BRIDGE] flushing ' + pending.length + ' pending messages');
      for (const msg of pending) {
        window._realHandleMessage(msg);
      }
      window._pendingMessages = [];
    }

    window.addEventListener('beforeunload', () => {
      clearVisemeTimers();
    });
    window.addEventListener('pagehide', () => {
      clearVisemeTimers();
    });
  </script>
</body>
</html>
