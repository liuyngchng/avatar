<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar PC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #canvas { display: block; }

    /* Status overlay */
    .status {
      position: fixed; bottom: 40px; left: 0; right: 0;
      text-align: center; color: rgba(255,255,255,0.7);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 16px; pointer-events: none;
      transition: opacity 0.3s;
    }
    .status.hidden { opacity: 0; }

    /* Subtitle bar */
    .subtitle {
      position: fixed; bottom: 80px; left: 10%; right: 10%;
      text-align: center; color: rgba(255,255,255,0.85);
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 20px; pointer-events: none;
      text-shadow: 0 0 8px rgba(0,0,0,0.5);
      transition: opacity 0.3s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .subtitle.hidden { opacity: 0; }

    /* Click anywhere */
    .tap-hint {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: rgba(255,255,255,0.25); font-size: 14px; pointer-events: none;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="tap-hint" id="tapHint">点击屏幕开始对话</div>
  <div class="subtitle hidden" id="subtitle"></div>
  <div class="status" id="status"></div>

  <!-- All JS loaded locally (no CDN, for air-gapped deployment) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./js/three.module.js",
      "three/addons/": "./js/addons/",
      "@pixiv/three-vrm": "./js/three-vrm.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { mixamoVRMRigMap } from './js/mixamoVRMRigMap.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    // ─── Globals ────────────────────────────────────────────
    let vrm = null;           // current VRM model
    let clock = new THREE.Clock();
    let currentMode = 'idle';
    let currentEmotion = 'neutral';
    let isSpeaking = false;
    let responseText = '';

    // Viseme state (for smooth lerp)
    // VRM1 uses: aa, ih, ou, ee, oh (not A/I/U/E/O)
    let visemeTargets = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
    let visemeCurrent = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
    let visemeBlendSpeed = 8.0; // how fast visemes transition

    // Pending viseme timeline — deferred until mode switches to "speaking".
    // Also handles race: if speaking state arrives before timeline, the
    // timeline plays itself when it eventually arrives.
    let pendingTimeline = null;

    // Blink state (4-phase state machine: open → closing → closed → opening → open)
    let blinkTimer = 0;
    let blinkInterval = 3.0;    // seconds between blinks
    let blinkValue = 0;
    let blinkPhase = 'open';    // 'open' | 'closing' | 'closed' | 'opening'
    let idleTime = 0;

    // Avatar is always centered in the window. Movement is done by moving the
    // entire window (via the IPC bridge), not by repositioning the avatar
    // within the window.
    const AVATAR_Y = -0.95;

    // Measured avatar world-space extents. Populated by fitWindowToAvatar()
    // once the model's bounding box is known.
    const avatarBounds = { worldW: 1.1, worldH: 1.7, worldCenter: new THREE.Vector3(0, 0.85, 0) };

    // Keyboard movement state — WASD + arrow keys → move the window.
    const keys = { left: false, right: false, up: false, down: false, ctrl: false };
    const winMoveSpeed = 250; // pixels per second

    // Orbit state — Ctrl + drag rotates the view around the avatar.
    // The camera orbits around avatarBounds.worldCenter (the avatar's pivot).
    let orbitActive = false;
    let orbitTheta = 0;     // horizontal angle (radians), 0 = look from front
    let orbitPhi = 0;       // vertical angle, positive = look from above
    let orbitDist = 3.5;    // distance from camera to pivot
    const orbitSpeed = 0.006; // radians per pixel of drag

    // ─── FBX Animation System ────────────────────────────────
    let mixer = null;              // THREE.AnimationMixer
    let animationMap = new Map();  // name → THREE.AnimationAction
    let currentAnimation = null;   // currently playing action name
    let crossFadeTarget = null;    // action being faded to
    const animCrossFadeDuration = 0.35; // seconds for cross-fade

    // Animation → mode mapping. Each mode/emotion picks one animation.
    // FBX files we have:
    //   Bored, CrossJumps, FightIdle, JumpingRope, Looking, LookingAround,
    //   MagicSpellCasting, OffensiveIdle, SearchingFilesHigh,
    //   StandingMagicAttack, TextingWhileStanding
    const animConfig = {
      idle:            'LookingAround',      // idle → looking around naturally
      listening:       'SearchingFilesHigh', // listening → searching pose
      thinking:        'MagicSpellCasting',  // thinking → magic casting
      speaking:        'TextingWhileStanding', // speaking → texting while standing
      emotion_happy:   'JumpingRope',
      emotion_angry:   'FightIdle',
      emotion_sad:     'Bored',
      emotion_surprised: 'OffensiveIdle',
      emotion_relaxed: 'Looking',
    };

    // ─── Three.js Setup ─────────────────────────────────────
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0); // fully transparent clear
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap; // soft-edged shadows
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    // Transparent background: no scene.background, no fog.
    // scene.background = null by default → WebGL renders alpha transparent.

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 0.9, 3.5);
    camera.lookAt(0, 0.7, 0);

    // ─── Lighting ───────────────────────────────────────────
    // Ambient — moderate ambient so the material's base color is visible.
    scene.add(new THREE.AmbientLight('#ffffff', 0.8));

    // Key light (from upper-right-front) — the main light source.
    const keyLight = new THREE.DirectionalLight('#ffffff', 0.8);
    keyLight.position.set(1.5, 2.5, 2);
    keyLight.target.position.set(0, -0.5, 0); // aim at the avatar's body
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 0.1;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.camera.left = -3;
    keyLight.shadow.camera.right = 3;
    keyLight.shadow.camera.top = 3;
    keyLight.shadow.camera.bottom = -3;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);
    scene.add(keyLight.target); // must add target to scene for .target to take effect

    // Fill light (from lower-left) — softens shadows without killing them.
    const fillLight = new THREE.DirectionalLight('#d0e8ff', 0.4);
    fillLight.position.set(-1, 0.3, -0.5);
    scene.add(fillLight);

    // Rim light (from behind and above) — creates a bright edge/contour
    // that separates the avatar from the background.
    const rimLight = new THREE.DirectionalLight('#ffffff', 0.3);
    rimLight.position.set(0.3, 1.5, -2.5);
    scene.add(rimLight);

    // ─── Ground: shadow disc ────────────────────────────────
    // The shadow disc is invisible but catches the avatar's shadow,
    // anchoring it to the "ground". No grid — the transparent background
    // already shows the desktop.
    const groundY = AVATAR_Y; // y-level of the avatar's feet

    const shadowDisc = new THREE.Mesh(
      new THREE.CircleGeometry(8, 48),
      new THREE.ShadowMaterial({ opacity: 0.3 })
    );
    shadowDisc.rotation.x = -Math.PI / 2;
    shadowDisc.position.y = groundY;
    shadowDisc.receiveShadow = true;
    scene.add(shadowDisc);

    // ─── Load VRM ───────────────────────────────────────────
    async function loadVRM(url) {
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));

      const gltf = await loader.loadAsync(url);
      vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      VRMUtils.rotateVRM0(vrm);

      scene.add(vrm.scene);
      vrm.scene.position.set(0, AVATAR_Y, 0);

      // Enable shadow casting on all VRM meshes so the ground plane
      // can receive the avatar's shadow.
      vrm.scene.traverse((obj) => {
        if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; }
      });

      // ── Fix arms: use official setNormalizedPose API ──────
      // Rotations are quaternions [x, y, z, w] relative to the T-pose.
      // In the T-pose the left arm points +X and the right arm points -X.
      // A positive Z rotation turns +X toward +Y (up), so to lower the arms
      // we rotate the LEFT arm by a NEGATIVE Z angle and the RIGHT arm by a
      // POSITIVE Z angle. ~85° brings them nearly straight down.
      if (vrm.humanoid) {
        const down = 85 * (Math.PI / 180);   // how far down from horizontal
        const s = Math.sin(down / 2);        // ≈ 0.676
        const c = Math.cos(down / 2);        // ≈ 0.737

        // Slight elbow bend (~8°) for a relaxed, natural look
        const eS = Math.sin(4 * (Math.PI / 180));
        const eC = Math.cos(4 * (Math.PI / 180));

        vrm.humanoid.setNormalizedPose({
          leftUpperArm:  { rotation: [0, 0, -s, c] },  // down
          rightUpperArm: { rotation: [0, 0,  s, c] },  // down
          leftLowerArm:  { rotation: [0, 0,  eS, eC] },
          rightLowerArm: { rotation: [0, 0, -eS, eC] },
        });
      }

      // ── Reset blink: eyes open on startup ──
      if (vrm.expressionManager) {
        vrm.expressionManager.setValue('blink', 0);
        vrm.expressionManager.setValue('blinkLeft', 0);
        vrm.expressionManager.setValue('blinkRight', 0);
      }

      console.log('VRM loaded:', vrm.meta?.metaVersion);
      console.log('Expressions:', Object.keys(vrm.expressionManager?.expressionMap || {}));
      document.getElementById('tapHint').style.display = 'block';
      updateStatus();

      // Load FBX animations and initialize the mixer.
      loadFBXAnimations().then(() => {
        initAnimationMixer();
      });

      // Auto-fit the GTK window to just the avatar's visible bounds.
      setTimeout(fitWindowToAvatar, 100);
    }

    // ─── Try to load a local VRM model, fallback to a simple placeholder ──
    async function initAvatar() {
      try {
        // Try loading a VRM model from the models/ directory.
        await loadVRM('/models/avatar.vrm');
      } catch (err) {
        console.error('VRM load failed:', err.message, err.stack);
        console.warn('Falling back to placeholder avatar...');
        createPlaceholderAvatar();
      }
    }

    // ─── Placeholder avatar (simple geometric character) ────
    function createPlaceholderAvatar() {
      const group = new THREE.Group();

      // Body (torso)
      const bodyGeo = new THREE.CapsuleGeometry(0.22, 0.5, 8, 16);
      const bodyMat = new THREE.MeshStandardMaterial({ color: '#4a6fa5', roughness: 0.3 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.75;
      body.castShadow = true;
      group.add(body);

      // Head
      const headGroup = new THREE.Group();
      headGroup.position.y = 1.25;

      const headGeo = new THREE.SphereGeometry(0.2, 32, 32);
      const headMat = new THREE.MeshStandardMaterial({ color: '#f5e6d3', roughness: 0.4 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.castShadow = true;
      headGroup.add(head);

      // Eyes
      const eyeGeo = new THREE.SphereGeometry(0.045, 16, 16);
      const eyeMat = new THREE.MeshStandardMaterial({ color: '#111111', roughness: 0.1 });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.07, 0.04, -0.17);
      headGroup.add(leftEye);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.07, 0.04, -0.17);
      headGroup.add(rightEye);

      // Mouth
      const mouthGeo = new THREE.BoxGeometry(0.1, 0.02, 0.01);
      const mouthMat = new THREE.MeshStandardMaterial({ color: '#cc4444', roughness: 0.3 });
      const mouth = new THREE.Mesh(mouthGeo, mouthMat);
      mouth.position.set(0, -0.06, -0.18);
      mouth.name = 'mouth';
      headGroup.add(mouth);

      group.add(headGroup);
      group.position.set(0, AVATAR_Y, 0);
      scene.add(group);

      // Store references for animation
      window._placeholder = { group, headGroup, mouth, leftEye, rightEye };

      console.log('Placeholder avatar created');
      document.getElementById('tapHint').style.display = 'block';
      updateStatus();

      // Auto-fit the GTK window to just the avatar's visible bounds.
      setTimeout(fitWindowToAvatar, 100);
    }

    // ─── Animation Loop ─────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);
      idleTime += dt;

      // Update orbit camera position from spherical coords.
      updateOrbitCamera();

      // Update FBX animation mixer (retargeted skeleton animation).
      if (mixer) {
        mixer.update(dt);
      }

      if (vrm) {
        // Update VRM
        updateVRMBlink(dt);
        updateVRMVisemes(dt);
        updateVRMIdleMicro(dt);
        updateWindowMove(dt);

        // VRM needs to be updated each frame for expressions to apply
        vrm.update(dt);
      } else if (window._placeholder) {
        updatePlaceholderBlink(dt);
        updatePlaceholderMouth(dt);
        updatePlaceholderIdle(dt);
        updateWindowMove(dt);
      }

      renderer.render(scene, camera);
    }

    // ─── Orbit camera ──────────────────────────────────────
    // Recomputes the camera position from the spherical orbit
    // coordinates (theta, phi, dist) around the avatar center.
    function updateOrbitCamera() {
      const center = avatarBounds.worldCenter;
      const sp = Math.sin(orbitPhi);
      const cp = Math.cos(orbitPhi);
      const st = Math.sin(orbitTheta);
      const ct = Math.cos(orbitTheta);

      camera.position.set(
        center.x + orbitDist * cp * st,
        center.y + orbitDist * sp,
        center.z + orbitDist * cp * ct
      );
      camera.lookAt(center.x, center.y, center.z);
    }

    // ─── VRM: Blink (4-phase state machine) ──────────────────
    function updateVRMBlink(dt) {
      // Apply blink (VRM1 preset name is 'blink') every frame.
      if (vrm.expressionManager && blinkValue > 0.001) {
        vrm.expressionManager.setValue('blink', blinkValue);
      }

      // Waiting for the next blink.
      if (blinkPhase === 'open') {
        blinkTimer += dt;
        if (blinkTimer > blinkInterval) {
          blinkPhase = 'closing';
          blinkTimer = 0;
          blinkInterval = 2.5 + Math.random() * 4.0;
        }
        return;
      }

      if (blinkPhase === 'closing') {
        blinkValue += dt * 12; // fast close
        if (blinkValue >= 1.0) {
          blinkValue = 1.0;
          blinkPhase = 'closed';
          blinkTimer = 0;
        }
        return;
      }

      if (blinkPhase === 'closed') {
        blinkTimer += dt;
        if (blinkTimer > 0.12) {
          blinkPhase = 'opening';
        }
        return;
      }

      if (blinkPhase === 'opening') {
        blinkValue -= dt * 12; // open
        if (blinkValue <= 0) {
          blinkValue = 0;
          blinkPhase = 'open';
          blinkTimer = 0;
        }
        return;
      }
    }

    // ─── VRM: Viseme (lip-sync) ─────────────────────────────
    function updateVRMVisemes(dt) {
      if (!vrm?.expressionManager) return;

      const visemeNames = ['aa', 'ih', 'ou', 'ee', 'oh'];
      const lerp = Math.min(visemeBlendSpeed * dt, 1.0);

      for (const name of visemeNames) {
        visemeCurrent[name] += (visemeTargets[name] - visemeCurrent[name]) * lerp;
        vrm.expressionManager.setValue(name, visemeCurrent[name]);
      }
    }

    // ─── VRM: Idle micro-movement ───────────────────────────
    function updateVRMIdleMicro(dt) {
      if (currentMode !== 'idle') return;
      if (!vrm?.scene) return;

      const t = idleTime;
      // Subtle breathing (layered on top of the fixed root height)
      const breathe = Math.sin(t * 1.4) * 0.008;
      vrm.scene.position.y = AVATAR_Y + breathe;
      // Subtle side-to-side sway
      vrm.scene.position.x = Math.sin(t * 0.7) * 0.015;
      vrm.scene.rotation.z = Math.sin(t * 0.7) * 0.015;
      // Gentle body turn so the side profile is occasionally visible —
      // this is what makes the 3D volume read as "solid" rather than flat.
      vrm.scene.rotation.y = Math.sin(t * 0.4) * 0.18;

      // Keep the mouth slightly parted in idle so it's always visible.
      // A natural resting expression has the lips just barely apart.
      visemeTargets['aa'] = 0.04 + Math.sin(t * 1.4) * 0.01;
    }

    // ─── Placeholder: Blink ─────────────────────────────────
    let placeholderBlink = 0;
    let placeholderBlinking = false;
    let placeholderBlinkTimer = 0;

    function updatePlaceholderBlink(dt) {
      const { leftEye, rightEye } = window._placeholder;
      placeholderBlinkTimer += dt;
      const blinkInterval = 3.0;

      if (!placeholderBlinking && placeholderBlinkTimer > blinkInterval) {
        placeholderBlinking = true;
        placeholderBlink = 0;
      }

      if (placeholderBlinking) {
        placeholderBlink += dt * 10;
        if (placeholderBlink >= 1.0) {
          placeholderBlinkTimer += dt;
          if (placeholderBlinkTimer > 0.15) {
            placeholderBlink -= dt * 10;
            if (placeholderBlink <= 0) {
              placeholderBlink = 0;
              placeholderBlinking = false;
              placeholderBlinkTimer = 0;
            }
          }
        }
      }

      const eyeScale = 1 - placeholderBlink * 0.9;
      leftEye.scale.y = eyeScale;
      rightEye.scale.y = eyeScale;
    }

    // ─── Placeholder: Mouth (speaking) ───────────────────────
    let placeholderMouthTime = 0;
    function updatePlaceholderMouth(dt) {
      const { mouth } = window._placeholder;
      if (!mouth) return;

      if (isSpeaking) {
        placeholderMouthTime += dt;
        // Simple oscillating mouth open/close while speaking
        const openness = 0.5 + 0.5 * Math.sin(placeholderMouthTime * 12);
        mouth.scale.y = 0.3 + openness * 8;
        mouth.position.y = -0.06 - openness * 0.04;
      } else {
        mouth.scale.y = 0.3;
        mouth.position.y = -0.06;
      }
    }

    // ─── Placeholder: Idle sway ──────────────────────────────
    function updatePlaceholderIdle(dt) {
      if (currentMode !== 'idle') return;
      const { group } = window._placeholder;
      if (!group) return;
      const t = idleTime;
      group.position.y = AVATAR_Y + Math.sin(t * 1.4) * 0.005;
      group.position.x = Math.sin(t * 0.7) * 0.01;
      group.rotation.z = Math.sin(t * 0.7) * 0.01;
    }

    // ─── Window move via keyboard (per-frame) ─────────────────
    function updateWindowMove(dt) {
      let dx = 0, dy = 0;
      if (keys.left)  dx -= 1;
      if (keys.right) dx += 1;
      if (keys.down)  dy += 1;
      if (keys.up)    dy -= 1;
      if (dx === 0 && dy === 0) return;

      const px = Math.round(dx * winMoveSpeed * dt);
      const py = Math.round(dy * winMoveSpeed * dt);
      if (px !== 0 || py !== 0) {
        if (window.goBridge_moveWindow) {
          window.goBridge_moveWindow(px, py);
        }
      }
    }

    // ─── Status UI ──────────────────────────────────────────
    function updateStatus() {
      const el = document.getElementById('status');
      const sub = document.getElementById('subtitle');
      const hint = document.getElementById('tapHint');

      switch (currentMode) {
        case 'idle':
          el.textContent = '';
          sub.classList.add('hidden');
          hint.style.display = 'block';
          break;
        case 'listening':
          el.textContent = '聆听中...';
          sub.classList.add('hidden');
          hint.style.display = 'none';
          break;
        case 'thinking':
          el.textContent = '思考中...';
          sub.classList.add('hidden');
          hint.style.display = 'none';
          break;
        case 'speaking':
          el.textContent = '';
          sub.textContent = responseText || '';
          sub.classList.remove('hidden');
          hint.style.display = 'none';
          break;
      }
    }

    // ─── JS Bridge: Receive messages from Go ─────────────────
    // Called by Go via Eval: handleMessage(jsonString)
    //
    // Viseme timeline is deferred until mode switches to "speaking",
    // so the mouth animation syncs with actual audio playback.
    // Handles both possible arrival orders:
    //   1. timeline arrives first  → stored, played when mode → speaking
    //   2. speaking state arrives first → timeline plays itself on arrival
    window.handleMessage = function(jsonStr) {
      try {
        const msg = JSON.parse(jsonStr);
        if (msg.type === 'viseme_timeline') {
          if (currentMode === 'speaking') {
            // Already speaking — play immediately.
            playVisemeTimeline(msg.timeline);
          } else {
            // Store; will be played when the mode switches to speaking.
            pendingTimeline = msg.timeline;
          }
          return;
        }
        if (msg.type === 'viseme') {
          // Single viseme instruction (fallback).
          applyViseme(msg.viseme, msg.weight);
          return;
        }
        if (msg.mode) {
          currentMode = msg.mode;
          isSpeaking = msg.isSpeaking || false;
          responseText = msg.responseText || '';
          if (msg.emotion) currentEmotion = msg.emotion;
          updateStatus();
          if (currentMode === 'speaking' && pendingTimeline) {
            // Audio just started — fire the stored viseme timeline.
            playVisemeTimeline(pendingTimeline);
            pendingTimeline = null;
          } else if (currentMode !== 'speaking') {
            // Discard any stale pending timeline.
            pendingTimeline = null;
          }
          applyModeToVRM();
        }
      } catch (e) {
        console.error('handleMessage error:', e);
      }
    };

    // ─── Play a viseme timeline with local timers ──────────
    // Drives the mouth via setTimeout so there's no round-trip delay.
    let visemeTimers = [];
    function playVisemeTimeline(timeline) {
      if (!timeline || !timeline.length) return;

      // Clear any previous pending timers.
      for (const t of visemeTimers) clearTimeout(t);
      visemeTimers = [];

      const start = performance.now();

      for (const entry of timeline) {
        const delay = Math.max(0, entry.startMs - (performance.now() - start));
        const timer = setTimeout(() => {
          if (entry.viseme === 'rest' || !entry.viseme) {
            applyViseme('rest', 0);
          } else {
            applyViseme(entry.viseme, 1.0);
          }
        }, delay);
        visemeTimers.push(timer);
      }

      // Reset mouth at the end of the timeline.
      const lastStart = timeline.length > 0 ? timeline[timeline.length - 1].startMs : 0;
      const resetTimer = setTimeout(() => {
        applyViseme('rest', 0);
      }, lastStart + 200);
      visemeTimers.push(resetTimer);
    }

    // ─── Apply a single viseme to the VRM model ──────────────
    function applyViseme(viseme, weight) {
      if (!vrm?.expressionManager) return;

      // VRM1 mouth visemes: aa, ih, ou, ee, oh
      const mouthVisemes = ['aa', 'ih', 'ou', 'ee', 'oh'];

      if (viseme === 'rest' || !viseme) {
        // Reset all visemes (closed mouth).
        for (const name of mouthVisemes) {
          visemeTargets[name] = 0;
        }
        return;
      }

      // Set the target viseme to the given weight, others to 0.
      for (const name of mouthVisemes) {
        visemeTargets[name] = (name === viseme) ? weight : 0;
      }
    }

    // ─── Apply mode/emotion/speaking state to VRM ──────────────
    function applyModeToVRM() {
      if (!vrm?.expressionManager) return;

      // Reset all preset expressions to neutral
      const presets = ['happy', 'angry', 'sad', 'surprised', 'relaxed', 'neutral'];
      for (const p of presets) {
        vrm.expressionManager.setValue(p, 0);
      }

      // Apply emotion
      if (currentEmotion !== 'neutral' && presets.includes(currentEmotion)) {
        vrm.expressionManager.setValue(currentEmotion, 1.0);
      }

      // Visemes are driven by real-time viseme messages from Go,
      // not by the mode/emotion state. When not speaking, reset
      // the mouth to closed.
      if (!isSpeaking) {
        applyViseme('rest', 0);
      }

      // Switch FBX animation to match the current mode + emotion.
      playAnimation(currentMode, currentEmotion);
    }

    // ─── JS Bridge: Send events to Go ───────────────────────
    function sendEvent(type, data) {
      const msg = JSON.stringify({ type, data });
      // WebKitGTK path (Linux) — bridge handler
      if (window.webkit?.messageHandlers?.bridge) {
        window.webkit.messageHandlers.bridge.postMessage(msg);
      }
      // WebView2 path (Windows)
      if (window.goBridge_sendEvent) {
        window.goBridge_sendEvent(msg);
      }
      if (window.chrome?.webview) {
        window.chrome.webview.postMessage(msg);
      }
      console.log('sendEvent:', type, data);
    }

    // ─── JS Bridge: window move (Go ⇄ JS) ─────────────────
    // Set up goBridge_moveWindow once, based on the available bridge.
    //   - Linux (WebKitGTK): window.webkit.messageHandlers.move
    //   - Windows (WebView2): goBridge_moveWindow bound by Go
    (function setupMoveBridge() {
      if (window.webkit?.messageHandlers?.move) {
        window.goBridge_moveWindow = function(dx, dy) {
          window.webkit.messageHandlers.move.postMessage(
            JSON.stringify({ dx, dy }));
        };
      }
      // On Windows, goBridge_moveWindow is bound directly by Go; leave as-is.
    })();

    // ─── Auto-fit window to avatar bounding box ─────────────────
    // Measures the avatar's bounding box, then resizes the window so the
    // avatar's on-screen height equals half the screen height.  The window
    // aspect ratio matches the avatar's width/height ratio.
    function fitWindowToAvatar() {
      const box = new THREE.Box3();
      scene.traverse((obj) => {
        // Skip the ground helpers — they're huge and would distort the bbox.
        if (!obj.isMesh || obj === shadowDisc) return;
        box.expandByObject(obj);
      });
      if (box.isEmpty()) return;

      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);

      console.log('avatar world bbox:', size.x.toFixed(2), 'x', size.y.toFixed(2),
                  'center:', center.x.toFixed(2), center.y.toFixed(2), center.z.toFixed(2));

      // Store world-space extents for camera fit.
      avatarBounds.worldW = size.x;
      avatarBounds.worldH = size.y;
      avatarBounds.worldCenter.copy(center);

      // Target: avatar height = half the screen height.
      const screenH = screen.height || 1080; // fallback if screen is unavailable
      const targetPxH = Math.round(screenH * 0.5);
      const winH = targetPxH;
      // Square window — width follows the avatar height, not the avatar
      // width, so the avatar has room to rotate (drag to orbit) and the grid
      // extends on both sides without clipping.
      const winW = winH;

      console.log('fitWindowToAvatar: target px height:', targetPxH,
                  'window:', winW, 'x', winH);

      // Tell the C UI to resize the window.
      if (window.webkit?.messageHandlers?.resize) {
        window.webkit.messageHandlers.resize.postMessage(
          JSON.stringify({ width: winW, height: winH }));
      }
      // Defer camera fit to next frame — the window may not have resized yet.
      setTimeout(fitCameraToWindow, 50);
    }

    // Adjusts the camera distance so the avatar fills the current window,
    // keeping the same margin. Called on resize and after initial window fit.
    function fitCameraToWindow() {
      if (!avatarBounds.worldH) return;

      const margin = 1.02;
      const fovRad = camera.fov * Math.PI / 180;

      const distH = (avatarBounds.worldW * margin) / (2 * Math.tan(fovRad / 2) * camera.aspect);
      const distV = (avatarBounds.worldH * margin) / (2 * Math.tan(fovRad / 2));
      const dist = Math.max(distH, distV);

      orbitDist = dist;
      camera.near = Math.max(0.01, dist * 0.1);
      camera.updateProjectionMatrix();
      updateOrbitCamera(); // uses current orbitTheta/orbitPhi/orbitDist

      console.log('fitCameraToWindow: dist:', dist.toFixed(1),
                  'pos:', camera.position.x.toFixed(2), camera.position.y.toFixed(2));
    }

    // ─── FBX Animation Loading & Retargeting ─────────────────
    // Uses the official three-vrm Mixamo animation retargeting approach:
    //   - mixamoVRMRigMap: Mixamo bone name → VRM humanoid bone name
    //   - Quaternion space transform: parent rest rotation × track rotation × inverse rest rotation
    // This produces correct skeleton animation even when the Mixamo skeleton
    // has a different rest pose than the VRM skeleton.

    // Stores loaded but not-yet-retargeted clips (name → AnimationClip).
    let rawClipMap = new Map();

    // Load all FBX animations from /models/animations/.
    async function loadFBXAnimations() {
      const animNames = [
        'Bored', 'CrossJumps', 'FightIdle', 'JumpingRope', 'Looking',
        'LookingAround', 'MagicSpellCasting', 'OffensiveIdle',
        'SearchingFilesHigh', 'StandingMagicAttack', 'TextingWhileStanding'
      ];

      const fbxLoader = new FBXLoader();
      const results = await Promise.allSettled(
        animNames.map(name =>
          fbxLoader.loadAsync(`/models/animations/${name}.fbx`)
            .then(group => ({ name, group }))
        )
      );

      for (const result of results) {
        if (result.status !== 'fulfilled') {
          console.warn('FBX load failed:', result.reason?.message);
          continue;
        }
        const { name, group } = result.value;
        const clips = group.animations;
        if (!clips || clips.length === 0) {
          console.warn(`FBX ${name}: no animation clips found`);
          continue;
        }

        // Store the raw clip + its FBX group for retargeting.
        rawClipMap.set(name, { clip: clips[0], group });
        console.log(`FBX loaded: ${name} (${clips[0].duration.toFixed(1)}s)`);
      }

      console.log(`FBX animations loaded: ${rawClipMap.size}/${animNames.length}`);
    }

    // Retarget a single Mixamo AnimationClip to the VRM skeleton using the
    // official three-vrm approach (quaternion space transform).
    function retargetMixamoClip(rawClip, fbxGroup, vrm) {
      const clip = THREE.AnimationClip.findByName(rawClip, 'mixamo.com') || rawClip;

      const tracks = [];

      const restRotationInverse = new THREE.Quaternion();
      const parentRestWorldRotation = new THREE.Quaternion();
      const _quatA = new THREE.Quaternion();

      // Adjust position with reference to hips height.
      const motionHipsNode = fbxGroup.getObjectByName('mixamorigHips');
      const motionHipsHeight = motionHipsNode ? motionHipsNode.position.y : 0;
      const vrmHipsY = vrm.humanoid.normalizedRestPose.hips.position[1];
      const hipsPositionScale = vrmHipsY / (motionHipsHeight || 1);

      clip.tracks.forEach((track) => {
        const trackSplitted = track.name.split('.');
        const mixamoRigName = trackSplitted[0];
        const vrmBoneName = mixamoVRMRigMap[mixamoRigName];
        const vrmNodeName = vrm.humanoid?.getNormalizedBoneNode(vrmBoneName)?.name;
        const mixamoRigNode = fbxGroup.getObjectByName(mixamoRigName);

        if (vrmNodeName != null && mixamoRigNode != null) {
          const propertyName = trackSplitted[1];

          // Store rest-pose world rotations.
          mixamoRigNode.getWorldQuaternion(restRotationInverse).invert();
          mixamoRigNode.parent.getWorldQuaternion(parentRestWorldRotation);

          if (track instanceof THREE.QuaternionKeyframeTrack) {
            // Retarget rotation from Mixamo rig to VRM normalized bone.
            for (let i = 0; i < track.values.length; i += 4) {
              const flatQuaternion = track.values.slice(i, i + 4);
              _quatA.fromArray(flatQuaternion);
              // parent rest rotation × track rotation × inverse rest rotation
              _quatA.premultiply(parentRestWorldRotation).multiply(restRotationInverse);
              _quatA.toArray(flatQuaternion);
              flatQuaternion.forEach((v, index) => {
                track.values[index + i] = v;
              });
            }

            tracks.push(
              new THREE.QuaternionKeyframeTrack(
                `${vrmNodeName}.${propertyName}`,
                track.times,
                track.values.map((v, i) => (
                  vrm.meta?.metaVersion === '0' && i % 2 === 0 ? -v : v
                )),
              ),
            );
          } else if (track instanceof THREE.VectorKeyframeTrack) {
            const value = track.values.map(
              (v, i) => (vrm.meta?.metaVersion === '0' && i % 3 !== 1 ? -v : v) * hipsPositionScale
            );
            tracks.push(new THREE.VectorKeyframeTrack(`${vrmNodeName}.${propertyName}`, track.times, value));
          }
        }
      });

      return new THREE.AnimationClip('vrmAnimation', clip.duration, tracks);
    }

    // Create the AnimationMixer and retarget all loaded clips.
    function initAnimationMixer() {
      if (!vrm?.scene) return;
      if (rawClipMap.size === 0) return;

      mixer = new THREE.AnimationMixer(vrm.scene);

      for (const [name, { clip, group }] of rawClipMap) {
        const retargetedClip = retargetMixamoClip(clip, group, vrm);
        const action = mixer.clipAction(retargetedClip);
        action.setLoop(THREE.LoopRepeat);
        action.clampWhenFinished = false;
        animationMap.set(name, action);
      }

      // Free raw clip data (no longer needed).
      rawClipMap.clear();

      // Play the idle animation immediately.
      playAnimation('idle');
      console.log(`AnimationMixer initialized with ${animationMap.size} actions`);
    }

    // ─── Animation State Machine ──────────────────────────────
    // Picks the right animation for the current mode/emotion and cross-fades.
    function playAnimation(mode, emotion) {
      if (!mixer) return;

      // Determine the animation name.
      let animName = null;
      if (emotion && emotion !== 'neutral') {
        animName = animConfig[`emotion_${emotion}`] || null;
      }
      if (!animName) {
        animName = animConfig[mode] || null;
      }
      if (!animName) return;

      const action = animationMap.get(animName);
      if (!action) {
        console.warn(`Animation not found: ${animName}`);
        return;
      }
      if (currentAnimation === animName) return;

      const prevAction = animationMap.get(currentAnimation);
      currentAnimation = animName;

      if (prevAction && prevAction.isRunning()) {
        // Cross-fade from previous to new.
        action.reset().play();
        action.crossFadeFrom(prevAction, animCrossFadeDuration, true);
        console.log(`Animation cross-fade: ${prevAction.getClip().name} → ${animName}`);
      } else {
        // No previous animation — just play.
        action.reset().play();
        action.setEffectiveWeight(1.0);
        console.log(`Animation play: ${animName}`);
      }
    }
    // The window is borderless, so Windows provides no drag handle.
    // All dragging moves the window; the avatar stays fixed in the center.
    // A press without movement counts as a tap (starts the conversation).

    const raycaster = new THREE.Raycaster();
    const _ndc = new THREE.Vector2();

    function eventNDC(e) {
      _ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
      _ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
      return _ndc;
    }

    // Returns true if the pointer is over the avatar mesh.
    function hitAvatar(e) {
      const avatarObj = vrm ? vrm.scene : (window._placeholder ? window._placeholder.group : null);
      if (!avatarObj) return false;

      raycaster.setFromCamera(eventNDC(e), camera);
      const hits = raycaster.intersectObject(avatarObj, true);
      return hits.length > 0;
    }

    // Ctrl+drag moves the window; a plain drag orbits the camera.
    // { startX, startY, lastX, lastY, moved, isOrbit }
    let dragWindow = null;

    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // left button only

      // Ctrl+drag → move the window. Plain drag → orbit the camera.
      const isOrbit = !keys.ctrl;
      dragWindow = {
        startX: e.screenX,
        startY: e.screenY,
        lastX: e.screenX,
        lastY: e.screenY,
        moved: false,
        isOrbit,
      };
    });

    document.addEventListener('mousemove', (e) => {
      if (!dragWindow) {
        // Hover cursor: 'grab' for orbit (plain), 'move' for window move (Ctrl).
        canvas.style.cursor = keys.ctrl
          ? (hitAvatar(e) ? 'move' : 'default')
          : (hitAvatar(e) ? 'grab' : 'default');
        return;
      }

      const dx = e.screenX - dragWindow.lastX;
      const dy = e.screenY - dragWindow.lastY;

      // Ignore tiny jitter; only start dragging past a threshold so a
      // normal click still registers as a tap.
      if (!dragWindow.moved &&
          (Math.abs(e.screenX - dragWindow.startX) > 4 ||
           Math.abs(e.screenY - dragWindow.startY) > 4)) {
        dragWindow.moved = true;
      }

      if (dragWindow.moved) {
        if (dragWindow.isOrbit) {
          // Plain drag: orbit the camera around the avatar.
          orbitTheta -= dx * orbitSpeed;
          orbitPhi += dy * orbitSpeed;
          // Clamp vertical angle so the camera doesn't flip.
          orbitPhi = Math.max(-1.4, Math.min(1.4, orbitPhi));
        } else if (window.goBridge_moveWindow) {
          // Ctrl+drag: move the window.
          window.goBridge_moveWindow(dx, dy);
        }
      }

      dragWindow.lastX = e.screenX;
      dragWindow.lastY = e.screenY;
    });

    document.addEventListener('mouseup', (e) => {
      if (!dragWindow) return;
      const wasDrag = dragWindow.moved;
      dragWindow = null;
      canvas.style.cursor = 'default';
      if (!wasDrag) {
        sendEvent('tap', {});
      }
    });

    document.addEventListener('keydown', (e) => {
      // Don't consume shortcuts when the user is typing in an input.
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        sendEvent('tap', {});
        return;
      }

      // WASD + arrow keys for window movement.
      switch (e.key) {
        case 'w': case 'W': case 'ArrowUp':    keys.up    = true; e.preventDefault(); break;
        case 's': case 'S': case 'ArrowDown':  keys.down  = true; e.preventDefault(); break;
        case 'a': case 'A': case 'ArrowLeft':  keys.left  = true; e.preventDefault(); break;
        case 'd': case 'D': case 'ArrowRight': keys.right = true; e.preventDefault(); break;
        case 'Control': keys.ctrl = true; break;
      }
    });

    document.addEventListener('keyup', (e) => {
      switch (e.key) {
        case 'w': case 'W': case 'ArrowUp':    keys.up    = false; break;
        case 's': case 'S': case 'ArrowDown':  keys.down  = false; break;
        case 'a': case 'A': case 'ArrowLeft':  keys.left  = false; break;
        case 'd': case 'D': case 'ArrowRight': keys.right = false; break;
        case 'Control': keys.ctrl = false; break;
      }
    });

    // ─── Resize Handler ─────────────────────────────────────
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      // Re-fit the camera so the avatar fills the (now different) window.
      fitCameraToWindow();
      // Restore the avatar to its fixed center position.
      if (vrm) {
        vrm.scene.position.set(0, AVATAR_Y, 0);
      } else if (window._placeholder) {
        window._placeholder.group.position.set(0, AVATAR_Y, 0);
      }
    });

    // ─── Start ──────────────────────────────────────────────
    initAvatar().then(() => {
      animate();
    });
  </script>
</body>
</html>
